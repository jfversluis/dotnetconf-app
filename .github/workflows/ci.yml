name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Check native test SDK and workload pins
        run: |
          jq -s -e '.[0].sdk == .[1].sdk and .[0].workload == .[1].workload' \
            global.json tests/DotNetConf.DeviceTests/global.json
      - run: dotnet test tests/DotNetConf.Core.Tests/DotNetConf.Core.Tests.csproj -c Release --logger trx --results-directory TestResults
      - name: Source-generated Core serialization without JSON reflection
        run: dotnet test tests/DotNetConf.Core.Tests/DotNetConf.Core.Tests.csproj -c Release -p:JsonSerializerIsReflectionEnabledByDefault=false --filter 'Category!=AIAttributes' --logger "trx;LogFileName=core-no-reflection.trx" --results-directory TestResults
      - name: Publish and execute generated planner tools under NativeAOT
        run: |
          dotnet publish tests/DotNetConf.Planner.AotSmoke -c Release -r linux-x64 -o "$RUNNER_TEMP/planner-aot"
          "$RUNNER_TEMP/planner-aot/DotNetConf.Planner.AotSmoke"
      - name: Install pinned MAUI SDK for headless App tests
        run: dotnet workload install maui-android --version "$(jq -r '.workload.version' global.json)"
      - name: App ViewModel regression tests (headless desktop assembly)
        run: dotnet test tests/DotNetConf.App.Tests/DotNetConf.App.Tests.csproj -c Release -p:MobileTargetFramework=net11.0 --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-test-results
          path: TestResults/*.trx
          if-no-files-found: error
          retention-days: 7

  mobile-build:
    name: ${{ matrix.platform }} build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: ios
            runner: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile
        with:
          platform: ${{ matrix.platform }}
      - name: Android Release build
        if: matrix.platform == 'android'
        run: |
          test "$(dotnet msbuild src/DotNetConf.App/DotNetConf.App.csproj -nologo \
            -getProperty:PublishAot -p:TargetFramework=net11.0-android -p:Configuration=Release)" = false
          dotnet publish src/DotNetConf.App/DotNetConf.App.csproj -c Release -f net11.0-android -r android-arm64 -p:MobileTargetFramework=net11.0-android -p:AndroidPackageFormats=aab
      - name: Verify Android R8 mapping
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          r8_mode="$(dotnet msbuild src/DotNetConf.App/DotNetConf.App.csproj -nologo \
            -getProperty:AndroidR8ObfuscationMode -p:TargetFramework=net11.0-android \
            -p:MobileTargetFramework=net11.0-android -p:Configuration=Release -p:RuntimeIdentifier=android-arm64)"
          test "$r8_mode" = private-members || { echo "::error::Expected private-members R8 obfuscation, got '$r8_mode'."; exit 1; }
          publish_dir=src/DotNetConf.App/bin/Release/net11.0-android/android-arm64/publish
          test -s "$publish_dir/mapping.txt" || { echo "::error::R8 mapping.txt is missing or empty."; exit 1; }
          shopt -s nullglob
          bundles=("$publish_dir"/*-Signed.aab)
          test "${#bundles[@]}" -eq 1 || { echo "::error::Expected exactly one signed Android App Bundle."; exit 1; }
          unzip -p "${bundles[0]}" BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map | cmp - "$publish_dir/mapping.txt" \
            || { echo "::error::The signed AAB does not contain the generated R8 mapping."; exit 1; }
      - name: iOS Release simulator build (no signing credentials)
        if: matrix.platform == 'ios'
        run: dotnet build src/DotNetConf.App/DotNetConf.App.csproj -c Release -f net11.0-ios -p:MobileTargetFramework=net11.0-ios -p:RuntimeIdentifier=iossimulator-arm64 -p:EnableCodeSigning=false
      - name: Compile Android native regression host
        if: matrix.platform == 'android'
        run: dotnet build tests/DotNetConf.DeviceTests -f net11.0-android -p:MobileTargetFramework=net11.0-android
      - name: Compile iOS native regression host
        if: matrix.platform == 'ios'
        run: dotnet build tests/DotNetConf.DeviceTests -f net11.0-ios -p:MobileTargetFramework=net11.0-ios -p:RuntimeIdentifier=iossimulator-arm64 -p:EnableCodeSigning=false
