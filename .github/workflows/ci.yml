name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/DotNetConf.Core.Tests/DotNetConf.Core.Tests.csproj -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-test-results
          path: TestResults/*.trx
          if-no-files-found: error
          retention-days: 7

  mobile-build:
    name: ${{ matrix.platform }} build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: ios
            runner: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile
        with:
          platform: ${{ matrix.platform }}
      - name: Android Release build
        if: matrix.platform == 'android'
        run: dotnet build src/DotNetConf.App/DotNetConf.App.csproj -c Release -f net11.0-android -p:MobileTargetFramework=net11.0-android -p:AndroidPackageFormats=aab
      - name: iOS Release simulator build (no signing credentials)
        if: matrix.platform == 'ios'
        run: dotnet build src/DotNetConf.App/DotNetConf.App.csproj -c Release -f net11.0-ios -p:MobileTargetFramework=net11.0-ios -p:RuntimeIdentifier=iossimulator-arm64 -p:EnableCodeSigning=false
