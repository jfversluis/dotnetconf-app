name: Build temporary Essentials.AI package
on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile
        with:
          platform: ios
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android package-build prerequisites
        run: |
          dotnet workload install maui-android --version "$(jq -r '.workload.version' global.json)"
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build package from pinned public source
        run: bash eng/build-local-essentials-ai.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-essentials-ai
          path: artifacts/essentials-ai-feed/*.nupkg
          if-no-files-found: error
          retention-days: 14
